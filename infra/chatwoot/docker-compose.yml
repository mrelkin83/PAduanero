# =====================================================================
# CHATWOOT — bandeja omnicanal
# Se despliega en /opt/chatwoot (docs/RUNBOOK.md §1).
#
# Derivado del docker-compose.production.yaml oficial, con tres cambios
# deliberados:
#
#  1. Imagen COMMUNITY EDITION (etiqueta `-ce`). La etiqueta por defecto
#     incluye el directorio `enterprise/`, bajo licencia comercial separada
#     que exige suscripción en producción (CLAUDE.md §1.1). No se usa.
#  2. Etiqueta FIJA, nunca `latest`. Una actualización desatendida a media
#     noche es la forma más común de romper una bandeja en producción.
#  3. Postgres y Redis propios, no compartidos con Evolution. Cuesta unos
#     cientos de MB de RAM y evita que una migración de uno tumbe al otro.
#
# Antes del primer `up`:
#   docker compose run --rm rails bundle exec rails db:chatwoot_prepare
# =====================================================================

x-base: &base
  # Confirmar la etiqueta vigente antes de desplegar:
  #   https://hub.docker.com/r/chatwoot/chatwoot/tags
  # Tiene que terminar en -ce.
  image: chatwoot/chatwoot:v4.9.0-ce
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - almacenamiento:/app/storage

services:
  rails:
    <<: *base
    # `ports` en 127.0.0.1: Chatwoot NO se expone a internet directamente.
    # Delante va el Nginx del host, que es quien tiene el certificado.
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  sidekiq:
    <<: *base
    # Procesa los trabajos en segundo plano: entrega de mensajes salientes,
    # correos de notificación, webhooks. Si sidekiq está caído, la bandeja
    # se ve bien pero nada sale de ella — un fallo silencioso de los caros.
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME} -d chatwoot']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres:
  redis:
  # Adjuntos de las conversaciones. Entra en el respaldo (docs/RESPALDOS.md §1).
  almacenamiento:
