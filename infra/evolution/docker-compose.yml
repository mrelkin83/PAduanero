# =====================================================================
# EVOLUTION API — pasarela de WhatsApp
# Se despliega en /opt/evolution (docs/RUNBOOK.md §1).
#
# Tres decisiones que sostienen la mitigación del CLAUDE.md §1.3:
#
#  1. `instancias` es un volumen PERSISTENTE. Ahí vive el estado de la
#     sesión de WhatsApp y la activación de licencia. Si se pierde, hay que
#     reescanear el QR desde el celular del número del negocio Y reactivar
#     la licencia a mano.
#  2. Etiqueta de imagen FIJA, nunca `latest`. Una actualización desatendida
#     recrea el contenedor, y un contenedor recreado sin activación
#     responde 503: WhatsApp caído sin que nadie haya tocado nada.
#  3. `EVOLUTION_OPERATOR_EMAIL` en el .env para la autoactivación headless.
#
# Evolution NO se expone a internet. Habla con Chatwoot y con el motor por
# la red interna; el único acceso externo es el Manager, y solo por túnel
# SSH cuando haga falta.
# =====================================================================

services:
  api:
    # v2.3.7 es la ÚLTIMA ESTABLE. La 2.4.0 solo existe como rc1/rc2, que el
    # propio proyecto marca «do not deploy to production» (CLAUDE.md §1.3).
    #
    # Al ser anterior a la 2.4.0, esta versión NO pide activación de licencia:
    # todo el aparato de `EVOLUTION_OPERATOR_EMAIL` y del 503 queda montado
    # para el día que haya que subir, pero hoy no interviene.
    #
    # Revisar cada mes si salió la 2.4.0 estable:
    #   https://github.com/evolution-foundation/evolution-api/releases
    # Baileys sigue el protocolo de WhatsApp, que cambia sin avisar: quedarse
    # atrás termina en una conexión que se cae y no se puede arreglar.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - instancias:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Un 200 aquí significa «activada y sirviendo». Un 503 significa
      # «pendiente de activación», que es un fallo distinto y con otro
      # remedio: lo separa bin/salud.sh.
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d evolution']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # La sesión de WhatsApp y la activación. Lo respalda bin/respaldo.sh.
  instancias:
  postgres:
  redis:
